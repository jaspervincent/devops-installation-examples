services:
  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/config:/etc/prometheus/config
      #- ./prometheus/certs:/etc/prometheus/certs:ro
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/config/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --storage.tsdb.retention.time=60d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    #user: '0'
    ports:
      - 9090:9090
    networks:
      - monitor_net

  alertmanager:
    hostname: alertmanager
    container_name: alertmanager
    image: prom/alertmanager:v0.34.1
    volumes:
      - ./alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=240h
    ports:
      - 9093:9093
    networks:
      - monitor_net
    restart: always

  grafana:
    container_name: grafana
    image: grafana/grafana:13.2.4
    depends_on:
      - prometheus
    #user: '0'
    ports:
      - 3000:3000
    environment:
      - GF_FEATURE_TOGGLES_suggestedDashboards=true
      - GF_FEATURE_TOGGLES_dashboardValidatorApp=true
      - GF_FEATURE_TOGGLES_dashboardTemplates=true
      - GF_SECURITY_ADMIN_USER=admin
      # 仅在 grafana.db 中尚无 admin 用户时生效（first-run only）。
      # 之后改密码请用：docker exec -it grafana grafana cli admin reset-admin-password '新密码'
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitor_net
    restart: always

  prometheusalert:
    container_name: prometheusalert
    image: feiyu563/prometheus-alert:master
    depends_on:
      - prometheus
    user: '0'
    ports:
      - 18080:8080
    environment:
      - TZ=Asia/Shanghai
      # app.conf 的配置项可用 PA_ 前缀的环境变量初始化（配置项里的 - 换成 _）
      # 注意：挂载完整的 app.conf 会让这些变量不生效，所以下面的 conf 挂载保持注释
      - PA_LOGIN_USER=${PA_LOGIN_USER}
      - PA_LOGIN_PASSWORD=${PA_LOGIN_PASSWORD}
    volumes:
      #- ./prometheusalert/conf:/app/conf
      - prometheusalert_db:/app/db # 防模板丢失
      #- ./prometheusalert/logs:/app/logs
    networks:
      - monitor_net
    restart: always

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    hostname: cadvisor
    container_name: cadvisor
    #platform: linux/aarch64
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl
    ports:
      - 8080:8080
    networks:
      - monitor_net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    hostname: node-exporter
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|host|etc|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
    ports:
      - 9100:9100
    networks:
      - monitor_net

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:latest
    hostname: blackbox-exporter
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./exporter/blackbox-exporter/blackbox.yml:/etc/blackbox_exporter/config.yml
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    ports:
      - "9115:9115"
    networks:
      - monitor_net
    # 开启 icmp ping探测
    cap_add:
      - NET_RAW

  aliyun-exporter-sg:
    image: aylei/aliyun-exporter:0.3.1
    container_name: aliyun-exporter-sg
    hostname: aliyun-exporter-sg
    restart: unless-stopped
    command:
      - '-c'
      - '/etc/aliyun-exporter/config.yml'
      - '-p'
      - '9525'
    environment:
      - TZ=Asia/Shanghai
      - ALIYUN_ACCESS_ID=${ALIYUN_AK_ID}
      - ALIYUN_ACCESS_SECRET=${ALIYUN_AK_SECRET}
      - ALIYUN_REGION=ap-southeast-1
    volumes:
      - ./exporter/aliyun-exporter/config.yml:/etc/aliyun-exporter/config.yml:ro
    ports:
      - 9525:9525
    networks:
      - monitor_net

  aliyun-exporter-hk:
    image: aylei/aliyun-exporter:0.3.1
    container_name: aliyun-exporter-hk
    hostname: aliyun-exporter-hk
    restart: unless-stopped
    command:
      - '-c'
      - '/etc/aliyun-exporter/config.yml'
      - '-p'
      - '9525'
    environment:
      - TZ=Asia/Shanghai
      - ALIYUN_ACCESS_ID=${ALIYUN_AK_ID}
      - ALIYUN_ACCESS_SECRET=${ALIYUN_AK_SECRET}
      - ALIYUN_REGION=cn-hongkong
    volumes:
      - ./exporter/aliyun-exporter/config-meta.yml:/etc/aliyun-exporter/config.yml:ro
    ports:
      - 9526:9525
    networks:
      - monitor_net

  yace:
    image: quay.io/prometheuscommunity/yet-another-cloudwatch-exporter:v0.67.0
    hostname: yace
    container_name: yace
    restart: unless-stopped
    command:
      - --config.file=/etc/yace/config.yml
      - --listen-address=0.0.0.0:5000
      - --scraping-interval=300
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_AK_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_AK_SECRET}
    volumes:
      - ./exporter/yace/config.yml:/etc/yace/config.yml:ro
    networks:
      - monitor_net

networks:
  monitor_net:
    name: monitor_net
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  prometheusalert_db:

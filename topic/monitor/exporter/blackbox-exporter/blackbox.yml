modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: "ip4"
      valid_status_codes: [200, 401, 301, 302]
      method: GET
  http_post_2xx:
    http:
      method: POST
      preferred_ip_protocol: ip4
    prober: http
  tcp_connect:
    prober: tcp
    timeout: 5s
  icmp:
    prober: icmp
    timeout: 5s

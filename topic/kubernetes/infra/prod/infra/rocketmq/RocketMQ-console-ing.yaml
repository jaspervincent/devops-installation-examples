apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-mq-console
  namespace: infra
spec:
  ingressClassName: nginx-prod
  rules:
  - host: kuberocketmqui.xxx.in
    http:
      paths:
      - backend:
          service:
            name: svc-mq-console
            port:
              number: 8180
        path: /
        pathType: ImplementationSpecific
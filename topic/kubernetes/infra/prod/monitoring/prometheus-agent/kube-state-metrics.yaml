---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
- apiGroups: [""]
  resources: [configmaps,secrets,nodes,pods,services,serviceaccounts,resourcequotas,replicationcontrollers,limitranges,persistentvolumeclaims,persistentvolumes,namespaces,endpoints]
  verbs: [list,watch]
- apiGroups: ["apps"]
  resources: [statefulsets,daemonsets,deployments,replicasets]
  verbs: [list,watch]
- apiGroups: ["batch"]
  resources: [cronjobs,jobs]
  verbs: [list,watch]
- apiGroups: ["autoscaling"]
  resources: [horizontalpodautoscalers]
  verbs: [list,watch]
- apiGroups: ["policy"]
  resources: [poddisruptionbudgets]
  verbs: [list,watch]
- apiGroups: ["certificates.k8s.io"]
  resources: [certificatesigningrequests]
  verbs: [list,watch]
- apiGroups: ["storage.k8s.io"]
  resources: [storageclasses,volumeattachments]
  verbs: [list,watch]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: [mutatingwebhookconfigurations,validatingwebhookconfigurations]
  verbs: [list,watch]
- apiGroups: ["networking.k8s.io"]
  resources: [networkpolicies,ingressclasses,ingresses]
  verbs: [list,watch]
- apiGroups: ["coordination.k8s.io"]
  resources: [leases]
  verbs: [list,watch]
- apiGroups: ["discovery.k8s.io"]
  resources: [endpointslices]
  verbs: [list,watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  ports:
  - name: metrics
    port: 8080
    protocol: TCP
    targetPort: metrics
  - name: telemetry
    port: 8081
    protocol: TCP
    targetPort: telemetry
  selector:
    app.kubernetes.io/name: kube-state-metrics
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: kube-state-metrics
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      containers:
      - image: 10.50.22.47/infra/registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: metrics
          timeoutSeconds: 1
        name: kube-state-metrics
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: telemetry
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: metrics
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
      imagePullSecrets:
      - name: harbor-pull
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
      serviceAccount: kube-state-metrics
      serviceAccountName: kube-state-metrics
      terminationGracePeriodSeconds: 30

# ==============================================================================
# Loki 微服务（Distributed）模式
# 集群约束：2 个可调度 worker（3 master 带 control-plane 污点），每台 3.2Gi allocatable
#
# 网络拓扑：
#   写入（集群内 Alloy）: http://loki-gateway.loki.svc.cluster.local  [ClusterIP]
#   查询（集群外 Grafana）: http://10.0.0.12                          [LoadBalancer, 只读]
#   只读网关仅放行查询接口，push/otlp 一律 403
# ==============================================================================
defaults:
  extraEnvFrom:
  - secretRef:
      name: loki-s3-credentials

loki:
  # ---- 响应压缩 ----
  # 注意是 frontend 段不是 server 段。放进 server 会直接让所有组件起不来：
  #   failed parsing config: field compress_responses not found in type server.Config
  # （实测踩过，9 个 Pod CrashLoop。/config 里这个键的完整路径是
  #  frontend.compress_responses，照着它写才对。）
  #
  # 本环境的跨区域压缩实际由只读网关的 nginx gzip 承担（见 extraObjects），
  # 这里开着是为了 Grafana 万一直连 Loki（不过网关）时压缩仍然生效。
  # 两者不会冲突：nginx 看到上游已带 content-encoding 就不会再压一次。
  frontend:
    compress_responses: true
    # approx_topk 的中间结果是 count-min sketch 向量，frontend 与 querier
    # 之间用默认的 json 编码传不了，必须 protobuf。
    # 它和 limits_config.shard_aggregations 是**一对**，少一个 approx_topk 就不可用。
    # 只影响内部通信，不改 HTTP API 的响应格式。
    encoding: protobuf
  commonConfig:
    replication_factor: 3
  # 零 PVC 方案全靠这个开关保证优雅重启（滚动更新 / drain）不丢未 flush 的 chunk。
  # chart 默认已是 true，这里显式钉死，避免升级 chart 时默认值无声变化。
  # 键的层级是查运行实例 /config 确认的：ingester.wal.flush_on_shutdown
  ingester:
    wal:
      flush_on_shutdown: true
  schemaConfig:
    configs:
    - from: '2024-04-01'
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: loki_index_
        period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 672h
    # ---- 差异化保留 ----
    # 全局默认 672h(28d)；下面的规则按流覆盖，priority 数字大的优先。
    # selector 只能用索引标签（source 是索引标签，可以用；结构化元数据不行）。
    # 业务日志不匹配任何规则，落到全局的 672h。
    #
    # events 和系统日志留 7 天的理由：两者都是"当时排障要看、过后价值迅速衰减"的数据，
    # 而业务日志要支撑更长周期的回溯。
    # 实测全栈才 0.02GB/天，现在不是容量问题——先把分级机制跑通并留档，
    # 等量涨上来直接改数字即可。
    retention_stream:
    - selector: '{source="kubernetes-events"}'
      priority: 10
      period: 168h
    - selector: '{source="systemd"}'
      priority: 10
      period: 168h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 20MB
    max_global_streams_per_user: 10000
    max_line_size: 256KB
    max_line_size_truncate: true
    max_entries_limit_per_query: 10000
    max_query_series: 500
    # 开启 approx_topk：topk 的**内层聚合**会先 materialize 所有序列，
    # 高基数字段（完整 URI、客户端 IP）一超过上面的 max_query_series
    # 整条查询就报错 "maximum number of series (500) reached"。
    # approx_topk 用概率结构算 topk，不受这个上限约束。
    #
    # 它依赖查询分片——本栈已满足：parallelise_shardable_queries=true，
    # schema 是 tsdb v13。查运行实例 /config 可确认。
    shard_aggregations:
    - approx_topk
    max_query_parallelism: 16
    max_query_length: 721h
  compactor:
    retention_enabled: true
    delete_request_store: s3
  rulerConfig:
    enable_api: true
    alertmanager_url: http://prom:9093
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    poll_interval: 30s
  querier:
    max_concurrent: 4
  storage:
    type: s3
    bucketNames:
      chunks: loki-test
      ruler: loki-test
    s3:
      endpoint: 10.0.0.101:9000
      s3ForcePathStyle: true
      insecure: true
      # 不写 accessKeyId / secretAccessKey：两者为空时 Loki 走 AWS SDK 默认凭证链，
      # 读 Secret 注入的 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY（见顶部 defaults）。
      # 这与生产 EKS 上的 IRSA 是同一条代码路径——届时只需给 serviceAccount 打
      # role 注解（chart 的 serviceAccount.annotations），这里一个字都不用改。
      #accessKeyId: <ak>
      #secretAccessKey: <sk>
deploymentMode: Distributed
singleBinary:
  replicas: 0
distributor:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
ingester:
  replicas: 3
  zoneAwareReplication:
    enabled: false
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution: null
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: ingester
              app.kubernetes.io/instance: loki
              app.kubernetes.io/name: loki
          topologyKey: kubernetes.io/hostname
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  kind: Deployment
querier:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
queryFrontend:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
queryScheduler:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
indexGateway:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  kind: Deployment
compactor:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  kind: Deployment
  strategy: &id001
    type: RollingUpdate
    rollingUpdate:
      partition: null
      maxSurge: 0
      maxUnavailable: 1
patternIngester:
  enabled: true
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  kind: Deployment
  strategy: *id001
ruler:
  enabled: true
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  kind: Deployment
  extraVolumes:
  - name: alert-rules
    configMap:
      name: loki-alert-rules
  extraVolumeMounts:
  - name: alert-rules
    mountPath: /etc/loki/rules/jasper
    readOnly: true
chunksCache:
  enabled: true
  allocatedMemory: 256
resultsCache:
  enabled: true
  allocatedMemory: 256
minio:
  enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
gateway:
  service:
    type: ClusterIP
  # 东八区。镜像是 Alpine，既没有 /etc/localtime 也没有 tzdata，
  # 只设 TZ=Asia/Shanghai 会因为找不到 zoneinfo 而静默回退 UTC；
  # 不设 TZ 时 musl 直接读 /etc/localtime，正好是挂进去的这个文件。
  extraVolumes:
  - name: tz-shanghai
    hostPath:
      path: /usr/share/zoneinfo/Asia/Shanghai
      type: File
  extraVolumeMounts:
  - name: tz-shanghai
    mountPath: /etc/localtime
    readOnly: true
extraObjects:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: loki-read-gateway
    namespace: loki
    labels:
      app.kubernetes.io/name: loki-read-gateway
      app.kubernetes.io/instance: loki
  spec:
    replicas: 1
    selector:
      matchLabels:
        app.kubernetes.io/name: loki-read-gateway
        app.kubernetes.io/instance: loki
    template:
      metadata:
        labels:
          app.kubernetes.io/name: loki-read-gateway
          app.kubernetes.io/instance: loki
      spec:
        securityContext:
          runAsUser: 101
          runAsGroup: 101
          fsGroup: 101
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine
          imagePullPolicy: IfNotPresent
          ports:
          - name: http
            containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
          - name: config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: tmp
            mountPath: /tmp
          # 东八区，理由同 gateway 段
          - name: tz-shanghai
            mountPath: /etc/localtime
            readOnly: true
        volumes:
        - name: config
          configMap:
            name: loki-read-gateway
        - name: tmp
          emptyDir: {}
        - name: tz-shanghai
          hostPath:
            path: /usr/share/zoneinfo/Asia/Shanghai
            type: File
- apiVersion: v1
  kind: Service
  metadata:
    name: loki-read-gateway
    namespace: loki
    labels:
      app.kubernetes.io/name: loki-read-gateway
      app.kubernetes.io/instance: loki
    annotations:
      io.cilium/lb-ipam-ips: 10.0.0.12
  spec:
    type: LoadBalancer
    selector:
      app.kubernetes.io/name: loki-read-gateway
      app.kubernetes.io/instance: loki
    ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
lokiCanary:
  enabled: true
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

worker_processes  2;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # nginx-unprivileged 以 uid 101 运行且根文件系统只读，临时目录必须指到 /tmp
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  log_format main '$remote_addr - [$time_local] $status "$request" '
                  '$body_bytes_sent $request_time "$http_x_scope_orgid"';
  access_log /dev/stdout main;

  sendfile    on;
  tcp_nopush  on;

  # ---- 响应压缩 ----
  # Grafana 在阿里云香港、Loki 在 AWS 新加坡，查询响应跨云跨境走公网，
  # 这是整条链路上最值得压的一段。实测日志 JSON 压缩比 10~13x
  # （107KB->10.7KB / 2.28MB->176KB），出口流量和传输时间都砍掉九成。
  #
  # Grafana 的 Loki 数据源默认就会发 Accept-Encoding: gzip，服务端一开即生效。
  gzip on;
  # 查询结果是 JSON；text/plain 覆盖 /metrics 之类的端点
  gzip_types application/json text/plain;
  # 4 是性价比拐点：再往上 CPU 涨得快，体积只多省几个百分点
  gzip_comp_level 4;
  # 小响应压了反而更大（gzip 头部开销），1k 以下不压
  gzip_min_length 1k;
  # 必须显式开：默认 off 时，带 Via 头的代理响应一律不压，
  # 而这里 nginx 就是反向代理，不加这行等于没开
  gzip_proxied any;
  # 让 CDN / 中间代理按 Accept-Encoding 分别缓存，避免把压缩版发给不支持的客户端
  gzip_vary on;
  resolver    kube-dns.kube-system.svc.cluster.local.;

  # 查询可能较慢，放宽超时；tail 是长连接
  proxy_read_timeout    300s;
  proxy_send_timeout    300s;
  proxy_connect_timeout 10s;

  server {
    listen 8080;

    # ---------- 健康检查 ----------
    location = /ready {
      return 200 'ready';
      add_header Content-Type text/plain;
      access_log off;
    }
    location = / {
      return 200 'loki read-only gateway';
      add_header Content-Type text/plain;
      access_log off;
    }

    # ---------- 显式拒绝所有写入接口 ----------
    # 精确匹配(=)优先级高于前缀匹配(^~)，所以这几条先命中
    location = /loki/api/v1/push {
      return 403 'write denied: this is a read-only gateway';
      add_header Content-Type text/plain;
    }
    location = /api/prom/push {
      return 403 'write denied: this is a read-only gateway';
      add_header Content-Type text/plain;
    }
    location = /otlp/v1/logs {
      return 403 'write denied: this is a read-only gateway';
      add_header Content-Type text/plain;
    }

    # ---------- 只放行查询接口 ----------
    # query / query_range / labels / label values / series / tail /
    # index_stats / volume / patterns / detected_* 全部由 query-frontend 承接
    location ^~ /loki/api/v1/ {
      set $backend "http://loki-query-frontend.loki.svc.cluster.local:3100";
      proxy_pass   $backend$request_uri;

      # Grafana Live tailing 走 websocket
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
    }
    location ^~ /api/prom/ {
      set $backend "http://loki-query-frontend.loki.svc.cluster.local:3100";
      proxy_pass   $backend$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host       $host;
    }

    # ---------- 其余一律拒绝（/config /metrics /ring /distributor 等管理接口）----------
    location / {
      return 403 'forbidden: read-only gateway exposes query APIs only';
      add_header Content-Type text/plain;
    }
  }
}
